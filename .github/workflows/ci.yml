name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt (fail on any output)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The e2e suite spawns a real server, so the TS job needs Go too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json

      - name: install
        run: npm ci
        working-directory: sdk/ts

      - name: typecheck + build
        run: |
          npm run typecheck
          npm run build
        working-directory: sdk/ts

      - name: npm test
        run: npm test
        working-directory: sdk/ts
